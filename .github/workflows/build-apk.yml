name: Build PostFlow Agent FINAL CHROME FIXED

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PostFlow Agent FINAL CHROME FIXED APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android source
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " POSTFLOW FINAL CHROME FIXED"
          echo " PREPARE SOURCE"
          echo "========================================"

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find . -maxdepth 2 -type f \
              \( -iname '*.zip' \) \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Không tìm thấy source Android hoặc ZIP"
              find . -maxdepth 3 -type f | sort
              exit 1
            fi

            echo "SOURCE ZIP: $ZIP_FILE"

            rm -rf build-project
            mkdir -p build-project
            unzip -q "$ZIP_FILE" -d build-project

            SETTINGS_FILE="$(find build-project \
              -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -not -path '*/.gradle/*' \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: ZIP không chứa Android Gradle project"
              find build-project -maxdepth 5 -type f | sort
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Verify source
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle" || \
          test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/vn/phutungmaykubota/postflowagent/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/vn/phutungmaykubota/postflowagent/PostFlowAccessibilityService.java"
          test -f "$PROJECT_DIR/app/src/main/java/vn/phutungmaykubota/postflowagent/AgentSync.java"
          test -f "$PROJECT_DIR/app/src/main/res/xml/accessibility_service_config.xml"

          echo ""
          echo "=== CHECK CHROME FIX ==="
          grep -n "isChromeActive\|com.android.chrome\|Ignore Launcher" \
            "$PROJECT_DIR/app/src/main/java/vn/phutungmaykubota/postflowagent/PostFlowAccessibilityService.java" \
            || true

          echo ""
          echo "SOURCE OK"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          echo ""
          gradle --version
          echo ""
          sdkmanager --list_installed | grep -E 'platforms;android-35|build-tools;35' || true

      - name: Build FINAL APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo " BUILD POSTFLOW FINAL CHROME FIXED"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Find and verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR/app/build" -type f | sort || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/PostFlow-Agent-FINAL-CHROME-FIXED.apk"

          unzip -t \
            "$GITHUB_WORKSPACE/PostFlow-Agent-FINAL-CHROME-FIXED.apk" \
            >/dev/null

          echo "APK OK:"
          ls -lh "$GITHUB_WORKSPACE/PostFlow-Agent-FINAL-CHROME-FIXED.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: postflow-agent-final-chrome-fixed
          path: PostFlow-Agent-FINAL-CHROME-FIXED.apk
          if-no-files-found: error
          retention-days: 30
